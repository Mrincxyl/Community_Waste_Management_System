{% extends "municipality/base_municipality.html" %}

{% block content %}

<div class="max-w-5xl mx-auto px-4 py-10">

    <div class="bg-white rounded-2xl border border-slate-200 shadow-xl overflow-hidden">

        <!-- Header -->
        <div class="relative bg-slate-900 px-8 py-9">
            <div class="absolute inset-0 bg-gradient-to-r from-slate-900 via-slate-800 to-teal-900 opacity-95"></div>
            
            <div class="relative">
                <h1 class="text-3xl font-semibold tracking-tight text-white">
                    Edit Worker
                </h1>
                <p class="mt-1.5 text-slate-300 text-base">
                    Update worker information.
                </p>
            </div>
        </div>

        <form method="POST" enctype="multipart/form-data" class="p-8 md:p-10">
            {% csrf_token %}

            <div class="grid lg:grid-cols-12 gap-10">

                <!-- Left – Profile Photo -->
                <div class="lg:col-span-4 flex flex-col items-center">

                    <div class="relative">
                        {% if worker.user.profile_picture %}
                            <img id="preview"
                                 src="{{ worker.user.profile_picture.url }}"
                                 class="w-44 h-44 rounded-full object-cover ring-4 ring-white shadow-lg"
                                 alt="{{ worker.user.full_name }}">
                        {% else %}
                            <div id="defaultAvatar"
                                 class="w-44 h-44 rounded-full bg-slate-200 text-slate-600 flex items-center justify-center text-5xl font-semibold ring-4 ring-white shadow-lg">
                                {{ worker.user.full_name|first|upper }}
                            </div>
                            <img id="preview"
                                 class="hidden w-44 h-44 rounded-full object-cover ring-4 ring-white shadow-lg">
                        {% endif %}
                    </div>

                    <label class="mt-6 cursor-pointer">
                        <div class="inline-flex items-center gap-2 bg-white border border-slate-300 hover:border-slate-400 text-slate-700 px-5 py-2.5 rounded-lg text-sm font-medium shadow-sm transition">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                            </svg>
                            Change Photo
                        </div>
                        <input id="imageInput"
                               type="file"
                               name="profile_picture"
                               accept="image/*"
                               class="hidden">
                    </label>

                    <p class="mt-3 text-xs text-slate-400 text-center max-w-[180px]">
                        Recommended: Square image, max 2 MB
                    </p>
                </div>

                <!-- Right – Form Fields -->
                <div class="lg:col-span-8">

                    <div class="grid md:grid-cols-2 gap-x-6 gap-y-5">

                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1.5">
                                Full Name
                            </label>
                            <input type="text"
                                   name="full_name"
                                   value="{{ worker.user.full_name }}"
                                   class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm focus:border-teal-600 focus:ring-1 focus:ring-teal-600 outline-none transition">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1.5">
                                Email
                            </label>
                            <input type="email"
                                   value="{{ worker.user.email }}"
                                   readonly
                                   class="w-full rounded-lg border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm text-slate-500 cursor-not-allowed">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1.5">
                                Phone
                            </label>
                            <input type="text"
                                   name="phone"
                                   value="{{ worker.user.phone }}"
                                   class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm focus:border-teal-600 focus:ring-1 focus:ring-teal-600 outline-none transition">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1.5">
                                Employee ID
                            </label>
                            <input type="text"
                                   value="{{ worker.employee_id }}"
                                   readonly
                                   class="w-full rounded-lg border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm text-slate-500 cursor-not-allowed">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1.5">
                                Ward
                            </label>
                            <input type="text"
                                   name="ward"
                                   value="{{ worker.ward }}"
                                   class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm focus:border-teal-600 focus:ring-1 focus:ring-teal-600 outline-none transition">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1.5">
                                Status
                            </label>
                            <select name="status"
                                    class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm focus:border-teal-600 focus:ring-1 focus:ring-teal-600 outline-none transition bg-white">
                                <option value="available" {% if worker.status == "available" %}selected{% endif %}>
                                    Available
                                </option>
                                <option value="busy" {% if worker.status == "busy" %}selected{% endif %}>
                                    Busy
                                </option>
                                <option value="offline" {% if worker.status == "offline" %}selected{% endif %}>
                                    Offline
                                </option>
                            </select>
                        </div>

                    </div>

                    <!-- Address -->
                    <div class="mt-5">
                        <label class="block text-sm font-medium text-slate-700 mb-1.5">
                            Address
                        </label>
                        <textarea name="address"
                                  rows="4"
                                  class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm focus:border-teal-600 focus:ring-1 focus:ring-teal-600 outline-none transition resize-none">{{ worker.user.address }}</textarea>
                    </div>

                    <!-- Actions -->
                    <div class="flex flex-wrap items-center gap-3 mt-10 pt-6 border-t border-slate-100">
                        <button type="submit"
                                class="inline-flex items-center justify-center bg-teal-700 hover:bg-teal-800 text-white px-7 py-2.5 rounded-lg text-sm font-medium shadow-sm transition focus:outline-none focus:ring-2 focus:ring-teal-500 focus:ring-offset-2">
                            Save Changes
                        </button>

                        <a href="{% url 'worker_detail' worker.id %}"
                           class="inline-flex items-center justify-center bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 px-7 py-2.5 rounded-lg text-sm font-medium transition">
                            Cancel
                        </a>
                    </div>

                </div>
            </div>
        </form>
    </div>
</div>

<script>
const input = document.getElementById("imageInput");
const preview = document.getElementById("preview");
const avatar = document.getElementById("defaultAvatar");

if (input) {
    input.onchange = function () {
        if (this.files && this.files[0]) {
            const reader = new FileReader();
            reader.onload = function (e) {
                preview.src = e.target.result;
                preview.classList.remove("hidden");
                if (avatar) {
                    avatar.style.display = "none";
                }
            };
            reader.readAsDataURL(this.files[0]);
        }
    };
}
</script>

{% endblock %}
