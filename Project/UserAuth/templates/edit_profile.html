{% extends "base.html" %}

{% block content %}

<div class="max-w-5xl mx-auto px-4 py-10">

    <div class="bg-white rounded-3xl shadow-2xl overflow-hidden">

        <!-- ================= HEADER ================= -->
        <div class="h-52 bg-gradient-to-r from-indigo-700 via-purple-600 to-violet-700 relative">
            <div class="absolute inset-0 bg-[radial-gradient(#ffffff33_1px,transparent_1px)] [background-size:30px_30px]"></div>
            
            <div class="absolute bottom-0 left-0 right-0 px-8 pb-8">
                <h1 class="text-4xl font-bold text-white">Edit Profile</h1>
                <p class="text-indigo-100 mt-2 text-lg">
                    Update your personal information and photo
                </p>
            </div>
        </div>

        <form method="POST" enctype="multipart/form-data" class="p-8 md:p-12">
            {% csrf_token %}

            <div class="grid lg:grid-cols-12 gap-12">

                <!-- ================= LEFT: AVATAR ================= -->
                <div class="lg:col-span-4 flex flex-col items-center">

                    <div class="relative">
                        {% if user.profile_picture %}
                            <img id="preview"
                                 src="{{ user.profile_picture.url }}"
                                 class="w-48 h-48 rounded-3xl border-4 border-white shadow-2xl object-cover">
                        {% else %}
                            <div id="defaultAvatar"
                                 class="w-48 h-48 rounded-3xl border-4 border-white bg-gradient-to-br from-indigo-600 to-purple-600 flex items-center justify-center text-white text-8xl font-bold shadow-2xl">
                                {{ user.full_name|default:user.username|first|upper }}
                            </div>
                        {% endif %}

                        <img id="preview" class="hidden w-48 h-48 rounded-3xl border-4 border-white shadow-2xl object-cover">
                    </div>

                    <label class="mt-8 cursor-pointer group">
                        <div class="bg-indigo-600 hover:bg-indigo-700 transition-all text-white px-8 py-3.5 rounded-2xl font-semibold flex items-center gap-3 shadow-lg">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v-4m0 0l4 4m-4-4l4-4m12 0v4m0 0l-4-4m4 4l-4 4" />
                            </svg>
                            Choose New Photo
                        </div>
                        <input type="file" name="profile_picture" id="imageInput" accept="image/*" class="hidden">
                    </label>

                    <p class="text-xs text-gray-500 mt-4 text-center">
                        JPG, PNG or JPEG • Max 5 MB
                    </p>
                </div>

                <!-- ================= RIGHT: FORM ================= -->
                <div class="lg:col-span-8">

                    <div class="grid md:grid-cols-2 gap-6">

                        <!-- Full Name -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Full Name</label>
                            <input type="text" 
                                   name="full_name" 
                                   value="{{ user.full_name }}"
                                   class="w-full border border-gray-300 rounded-2xl px-5 py-4 focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition">
                        </div>

                        <!-- Username -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Username</label>
                            <input type="text" 
                                   value="{{ user.username }}"
                                   readonly
                                   class="w-full bg-gray-100 border border-gray-200 rounded-2xl px-5 py-4 cursor-not-allowed text-gray-500">
                        </div>

                        <!-- Email -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Email Address</label>
                            <input type="email" 
                                   value="{{ user.email }}"
                                   readonly
                                   class="w-full bg-gray-100 border border-gray-200 rounded-2xl px-5 py-4 cursor-not-allowed text-gray-500">
                        </div>

                        <!-- Phone -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Phone Number</label>
                            <input type="text" 
                                   name="phone" 
                                   value="{{ user.phone }}"
                                   class="w-full border border-gray-300 rounded-2xl px-5 py-4 focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition">
                        </div>

                    </div>

                    <!-- Address -->
                    <div class="mt-8">
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Address</label>
                        <textarea name="address" 
                                  rows="5"
                                  class="w-full border border-gray-300 rounded-3xl px-5 py-4 focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none resize-none transition">{{ user.address }}</textarea>
                    </div>

                    <!-- Action Buttons -->
                    <div class="flex flex-wrap gap-4 mt-10">
                        <button type="submit"
                                class="bg-indigo-600 hover:bg-indigo-700 text-white px-10 py-4 rounded-2xl font-semibold shadow-lg transition-all active:scale-95">
                            Save Changes
                        </button>
                        
                        <a href="{% url 'profile' %}"
                           class="bg-gray-200 hover:bg-gray-300 px-10 py-4 rounded-2xl font-semibold transition-all">
                            Cancel
                        </a>
                    </div>

                </div>
            </div>
        </form>
    </div>
</div>

<!-- ================= Image Preview Script ================= -->
<script>
    const input = document.getElementById("imageInput");
    const preview = document.getElementById("preview");
    const defaultAvatar = document.getElementById("defaultAvatar");

    if (input) {
        input.onchange = function() {
            if (this.files && this.files[0]) {
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.classList.remove("hidden");
                    
                    if (defaultAvatar) {
                        defaultAvatar.style.display = "none";
                    }
                }
                reader.readAsDataURL(this.files[0]);
            }
        }
    }
</script>

{% endblock %}
