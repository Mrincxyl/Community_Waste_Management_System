{% extends "base.html" %}

{% block title %}Sign Up{% endblock title %}

{% block content %}

<section class="min-h-screen flex items-center justify-center px-4 py-10 bg-[#eefaf3]">

  <div class="w-full max-w-md bg-white rounded-[28px] shadow-xl border border-gray-100 p-8">

    <div class="text-center mb-7">
      <h2 class="text-3xl font-bold text-[#12324a]">Create Account</h2>
      <p class="text-sm text-gray-500 mt-2">
        Join WasteTracker and help keep the community clean
      </p>
    </div>

    <form method="POST" class="space-y-4">
      {% csrf_token %}

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Full Name</label>
        <div class="flex items-center h-12 border border-gray-200 rounded-xl px-4 bg-white focus-within:border-green-500 focus-within:ring-2 focus-within:ring-green-100">
          <span class="mr-3 text-green-600">👤</span>
          <input type="text" name="full_name" placeholder="Enter your full name"
            class="w-full outline-none text-sm text-gray-700 placeholder-gray-400">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
        <div class="flex items-center h-12 border border-gray-200 rounded-xl px-4 bg-white focus-within:border-green-500 focus-within:ring-2 focus-within:ring-green-100">
          <span class="mr-3 text-green-600">📧</span>
          <input type="email" name="email" placeholder="Enter your email"
            class="w-full outline-none text-sm text-gray-700 placeholder-gray-400">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Phone</label>
        <div class="flex items-center h-12 border border-gray-200 rounded-xl px-4 bg-white focus-within:border-green-500 focus-within:ring-2 focus-within:ring-green-100">
          <span class="mr-3 text-green-600">📱</span>
          <input type="text" name="phone" placeholder="Enter phone number"
            class="w-full outline-none text-sm text-gray-700 placeholder-gray-400">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Role</label>
        <div class="flex items-center h-12 border border-gray-200 rounded-xl px-4 bg-white focus-within:border-green-500 focus-within:ring-2 focus-within:ring-green-100">
          <span class="mr-3 text-green-600">🧑‍💼</span>
          <select name="role"
            class="w-full outline-none text-sm text-gray-700 bg-white">
            <option value="user">Normal User</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
        <div class="flex items-center h-12 border border-gray-200 rounded-xl px-4 bg-white focus-within:border-green-500 focus-within:ring-2 focus-within:ring-green-100">
          <span class="mr-3 text-green-600">🔒</span>
          <input type="password" name="password" placeholder="Create password"
            class="w-full outline-none text-sm text-gray-700 placeholder-gray-400">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Confirm Password</label>
        <div class="flex items-center h-12 border border-gray-200 rounded-xl px-4 bg-white focus-within:border-green-500 focus-within:ring-2 focus-within:ring-green-100">
          <span class="mr-3 text-green-600">🔐</span>
          <input type="password" name="confirm_password" placeholder="Confirm password"
            class="w-full outline-none text-sm text-gray-700 placeholder-gray-400">
        </div>
      </div>

      <button type="submit"
        class="w-full h-12 rounded-xl bg-green-600 text-white text-sm font-semibold shadow-md hover:bg-green-700 transition">
        Create Account
      </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-6">
      Already have an account?
      <a href="{% url 'login' %}" class="text-green-600 font-semibold hover:underline">Login</a>
    </p>

  </div>

</section>

{% endblock content %}
