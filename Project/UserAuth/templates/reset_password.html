{% extends "base.html" %}

{% block title %}Reset Password{% endblock %}

{% block content %}

<section class="min-h-screen flex items-center justify-center bg-slate-100 py-20">

    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl p-8">

        <div class="text-center">

            <div class="w-16 h-16 mx-auto rounded-full bg-green-100 flex items-center justify-center text-3xl">
                🔑
            </div>

            <h2 class="mt-5 text-3xl font-bold text-slate-800">

                Reset Password

            </h2>

            <p class="mt-2 text-slate-500">

                Create a new password for your account.

            </p>

        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="mt-5 rounded-xl bg-red-100 text-red-700 px-4 py-3">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" class="mt-8 space-y-6">

            {% csrf_token %}

            <div>

                <label class="block mb-2 font-semibold text-slate-700">

                    New Password

                </label>

                <input
                    type="password"
                    name="password"
                    required
                    placeholder="Enter new password"
                    class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:outline-none focus:ring-4 focus:ring-green-100 focus:border-green-500">

            </div>

            <div>

                <label class="block mb-2 font-semibold text-slate-700">

                    Confirm Password

                </label>

                <input
                    type="password"
                    name="confirm_password"
                    required
                    placeholder="Confirm password"
                    class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:outline-none focus:ring-4 focus:ring-green-100 focus:border-green-500">

            </div>

            <button
                type="submit"
                class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-xl font-semibold transition">

                Reset Password

            </button>

        </form>

    </div>

</section>

{% endblock %}
