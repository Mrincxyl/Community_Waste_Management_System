{% if messages %}
<div class="fixed top-24 right-5 space-y-3 z-[9999999] w-full max-w-sm pointer-events-none">
    {% for message in messages %}

    <div class="message-toast
        pointer-events-auto
        flex items-start gap-3 px-4 py-3 rounded-2xl border shadow-xl backdrop-blur-md
        {% if message.tags == 'success' %} bg-emerald-500/95 border-emerald-300 text-white {% endif %}
        {% if message.tags == 'error' %} bg-red-500/95 border-red-300 text-white {% endif %}
        {% if message.tags == 'warning' %} bg-amber-400/95 border-amber-200 text-slate-900 {% endif %}
        {% if message.tags == 'info' %} bg-sky-500/95 border-sky-300 text-white {% endif %}
    ">
        <div class="mt-0.5 flex h-7 w-7 items-center justify-center rounded-full bg-white/15 text-base shrink-0">
            {% if message.tags == 'success' %} ✓ {% endif %}
            {% if message.tags == 'error' %} × {% endif %}
            {% if message.tags == 'warning' %} ! {% endif %}
            {% if message.tags == 'info' %} i {% endif %}
        </div>

        <div class="flex-1 min-w-0">
            <p class="text-sm font-semibold leading-snug">{{ message }}</p>
        </div>

        <button onclick="this.parentElement.remove()"
                class="ml-2 inline-flex h-6 w-6 items-center justify-center rounded-full text-sm font-bold opacity-80 hover:opacity-100 transition">
            ×
        </button>

    </div>

    {% endfor %}
</div>

<script>
    setTimeout(() => {
        document.querySelectorAll('.message-toast').forEach(el => {
            el.style.transition = 'opacity 0.45s ease, transform 0.45s ease';
            el.style.opacity = '0';
            el.style.transform = 'translateY(-8px)';
            setTimeout(() => el.remove(), 450);
        });
    }, 3000);
</script>
{% endif %}
