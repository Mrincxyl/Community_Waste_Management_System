<div class="w-full">
  <form method="get" action="{{ request.path }}" class="flex items-center gap-2 rounded-xl border border-slate-700 bg-slate-800/60 px-2 py-1.5 shadow-inner shadow-slate-950/20">
    <svg class="h-4 w-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0 7 7 0 0114 0z" />
    </svg>
    <input
      type="search"
      name="search"
      value="{{ search|default:'' }}"
      placeholder="Search reports..."
      class="w-full bg-transparent text-sm text-white placeholder:text-slate-400 focus:outline-none"
      aria-label="Search reports"
    >
    <button type="submit" class="rounded-lg bg-teal-600 px-2.5 py-1.5 text-xs font-medium text-white hover:bg-teal-500 transition">
      Go
    </button>
  </form>
</div>
