<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>{% block title %}Community Waste Reporting{% endblock %}</title>

<style>

body{
    margin:0;
    padding:0;
    background:#f4f6f9;
    font-family:Arial,Helvetica,sans-serif;
}

.container{

    width:100%;
    padding:40px 0;

}

.card{

    max-width:650px;

    margin:auto;

    background:white;

    border-radius:15px;

    overflow:hidden;

    box-shadow:0 10px 30px rgba(0,0,0,.08);

}

.header{

    background:linear-gradient(135deg,#2563eb,#4f46e5);

    color:white;

    padding:35px;

    text-align:center;

}

.header h1{

    margin:0;

    font-size:30px;

}

.header p{

    opacity:.9;

    margin-top:10px;

}

.content{

    padding:40px;

}

.footer{

    background:#f7f7f7;

    text-align:center;

    padding:25px;

    color:#777;

    font-size:14px;

}

.button{

display:inline-block;

padding:14px 30px;

background:#2563eb;

color:white !important;

text-decoration:none;

border-radius:8px;

font-weight:bold;

margin-top:25px;

}

table{

width:100%;

border-collapse:collapse;

margin-top:20px;

}

td{

padding:14px;

border-bottom:1px solid #ececec;

}

.label{

font-weight:bold;

width:180px;

}

.status{

display:inline-block;

padding:8px 18px;

border-radius:30px;

background:#DBEAFE;

color:#1D4ED8;

font-weight:bold;

}

</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="header">

<h1>♻ Community Waste Reporting</h1>

<p>Keeping Our City Clean Together</p>

</div>

<div class="content">

{% block content %}

{% endblock %}

</div>

<div class="footer">

<strong>Community Waste Reporting & Tracking System</strong>

<br><br>

Thank you for contributing to a cleaner city.

<br><br>

© 2026 All Rights Reserved.

</div>

</div>

</div>

</body>

</html>
